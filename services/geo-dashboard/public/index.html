<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Geo Map Generator Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0b0d12; --fg:#e8e8e8; --muted:#888; --accent:#10b981; --accent-dim:#059669; --warn:#f59e0b; --err:#ef4444; --card:#11141a; --border:#232833; }
*{box-sizing:border-box} body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--fg);min-height:100vh}
a{color:var(--accent)} button{font:inherit;cursor:pointer;border:none;border-radius:6px;padding:8px 14px;background:var(--accent);color:#051d13;font-weight:600}
button:hover{background:var(--accent-dim)} button:disabled{background:#333;color:#777;cursor:not-allowed}
input,select{background:#0e1118;border:1px solid var(--border);color:var(--fg);padding:8px 10px;border-radius:6px;width:100%}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hdr h1{margin:0;font-size:18px} .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#1a2a20;color:var(--accent)}
.status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.s-queued{background:#374151;color:#9ca3af} .s-fetching{background:#3b2f1a;color:#fbbf24}
.s-building{background:#1e3a2e;color:#6ee7b7} .s-completed{background:#064e3b;color:#34d399}
.s-failed{background:#450a0a;color:#f87171}
#log{background:#06080d;border:1px solid var(--border);border-radius:6px;padding:12px;max-height:260px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;color:#a5d6a5}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div style="max-width:960px;margin:0 auto;padding:24px 16px">
  <header class="hdr"><h1>Geo Map Generator</h1><span class="badge">Admin</span></header>

  <section class="card">
    <h3 style="margin-top:0">Buat Peta Baru</h3>
    <div class="grid">
      <div><label>Nama (slug)</label><input id="name" placeholder="little_tokyo"></div>
      <div><label>Chunks</label><input id="chunks" type="number" value="32" min="8" max="64"></div>
      <div><label>Building Height (m)</label><input id="height" type="number" value="8" min="4" max="32"></div>
    </div>
    <div class="grid" style="margin-top:8px">
      <div><label>BBox w,s,e,n (lon,lat)</label><input id="bbox" placeholder="106.7916,-6.2538,106.8097,-6.2358"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnCreate">Generate Map</button>
      <span id="createStatus" class="small"></span>
    </div>
  </section>

  <section class="card">
    <h3 style="margin-top:0">Job Terbaru</h3>
    <div id="jobList" class="small">Loading…</div>
  </section>

  <section class="card" id="detailCard" style="display:none">
    <h3 style="margin-top:0">Detail Job <span id="detailId" class="small"></span></h3>
    <div class="grid">
      <div><label>Status</label><span id="detailStatus" class="status s-queued"></span></div>
      <div><label>Nama</label><span id="detailName"></span></div>
      <div><label>BBox</label><span id="detailBbox"></span></div>
      <div><label>Output Dir</label><span id="detailOutput"></span></div>
    </div>
    <div class="row" style="margin-top:12px"><button id="btnRefresh" disabled>Refresh</button><span id="refreshStatus" class="small"></span></div>

    <div id="mapWrap" style="display:none;margin-top:16px">
      <label>Peta Hasil Generate <span id="mapMeta" class="small"></span></label>
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#06080d;position:relative;max-width:640px;aspect-ratio:1/1">
        <img id="mapImg" alt="Peta hasil generate" style="width:100%;height:100%;display:block;image-rendering:pixelated">
        <div id="mapEmpty" class="small" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <a id="mapOpen" href="#" target="_blank" rel="noopener" style="font-size:13px">Buka ukuran penuh (2048×2048)</a>
      </div>
      <div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <button id="btnActivate">Pakai sebagai world aktif</button>
        <span id="activateStatus" class="small"></span>
      </div>
      <p class="small" style="margin:6px 0 0">Menyalin peta ini ke <code>public/world/</code> — world yang dibaca game. Game perlu reload untuk memakai peta ini.</p>
    </div>

    <label style="margin-top:16px">Build Log</label>
    <pre id="log"></pre>
  </section>
</div>

<script>
const API = '/api';
let currentJobId = null;

async function loadJobs() {
  try {
    const r = await fetch(API + '/jobs');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const jobs = await r.json();
    if (!jobs.length) {
      document.getElementById('jobList').textContent = 'Belum ada job. Buat lewat form di atas.';
      return;
    }
    document.getElementById('jobList').innerHTML = jobs.slice(0, 20).map(j =>
      `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
        <span class="status s-${j.status}">${j.status}</span>
        <strong>${j.name}</strong>
        <span class="small">${j.id}</span>
        <span class="small">${new Date(j.createdAt).toLocaleString()}</span>
        <button style="padding:2px 10px;font-size:12px" onclick="showJob('${j.id}')">Lihat</button>
      </div>`
    ).join('');
  } catch (e) {
    document.getElementById('jobList').textContent = 'Gagal memuat daftar job: ' + e.message;
  }
}
async function showJob(id) {
  currentJobId = id;
  const r = await fetch(API + '/jobs/' + id);
  renderDetail(await r.json());
  document.getElementById('detailCard').scrollIntoView({ behavior: 'smooth' });
}
window.showJob = showJob;

async function poll(jobId) {
  document.getElementById('refreshStatus').textContent = 'memuat…';
  try {
    const r = await fetch(API + '/jobs/' + jobId);
    const j = await r.json();
    renderDetail(j);
    if (j.status === 'completed' || j.status === 'failed') {
      document.getElementById('refreshStatus').textContent = 'selesai ' + new Date().toLocaleTimeString();
      document.getElementById('btnRefresh').disabled = true;
    } else {
      document.getElementById('refreshStatus').textContent = 'proses… refresh otomatis 5s';
      setTimeout(() => poll(jobId), 5000);
    }
  } catch (e) {
    document.getElementById('refreshStatus').textContent = 'error: ' + e;
  }
}

function renderDetail(j) {
  document.getElementById('detailCard').style.display = 'block';
  document.getElementById('detailId').textContent = j.id;
  document.getElementById('detailName').textContent = j.name;
  document.getElementById('detailStatus').textContent = j.status;
  document.getElementById('detailStatus').className = 'status s-' + j.status;
  document.getElementById('detailBbox').textContent = JSON.stringify(j.bbox);
  document.getElementById('detailOutput').textContent = j.outputDir || '-';
  document.getElementById('log').textContent = j.buildLog || j.error || '(belum ada log)';
  document.getElementById('btnRefresh').disabled = false;
  loadMapPreview(j.id, j.status);
}

async function loadMapPreview(jobId, status) {
  const wrap = document.getElementById('mapWrap');
  const img = document.getElementById('mapImg');
  const empty = document.getElementById('mapEmpty');
  const meta = document.getElementById('mapMeta');
  const open = document.getElementById('mapOpen');
  wrap.style.display = 'block';
  img.style.display = 'none'; empty.style.display = 'none';
  meta.textContent = ''; open.style.display = 'none';

  if (status && status !== 'completed') {
    empty.textContent = 'Peta tersedia setelah job selesai (status: ' + status + ').';
    empty.style.display = 'flex';
    return;
  }
  try {
    const r = await fetch(API + '/jobs/' + jobId + '/meta');
    const m = await r.json();
    if (!m.hasMap) {
      empty.textContent = 'Belum ada map.png untuk job ini.';
      empty.style.display = 'flex';
      return;
    }
    const url = API + '/jobs/' + jobId + '/map.png';
    img.onload = () => { img.style.display = 'block'; open.style.display = 'inline'; };
    img.onerror = () => { empty.textContent = 'Gagal memuat map.png.'; empty.style.display = 'flex'; };
    img.src = url;
    open.href = url;
    const parts = [];
    if (m.worldVersion) parts.push(m.worldVersion);
    if (m.worldChunks) parts.push(m.worldChunks + '×' + m.worldChunks + ' chunks');
    if (m.worldSize) parts.push(m.worldSize + ' m');
    meta.textContent = parts.length ? '· ' + parts.join(' · ') : '';
  } catch (e) {
    empty.textContent = 'Gagal memuat meta peta: ' + e.message;
    empty.style.display = 'flex';
  }
}

document.getElementById('btnCreate').addEventListener('click', async () => {
  const btn = document.getElementById('btnCreate');
  const st = document.getElementById('createStatus');
  btn.disabled = true; st.textContent = 'mengirim…';
  try {
    const body = {
      name: document.getElementById('name').value || 'unnamed',
      bbox: document.getElementById('bbox').value,
      chunks: Number(document.getElementById('chunks').value),
      buildingHeight: Number(document.getElementById('height').value),
    };
    const r = await fetch(API + '/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    st.textContent = 'job dibuat: ' + j.id;
    currentJobId = j.id;
    poll(j.id);
  } catch (e) {
    st.textContent = 'gagal: ' + e.message;
    btn.disabled = false;
  }
});

document.getElementById('btnRefresh').addEventListener('click', () => {
  if (currentJobId) poll(currentJobId);
});

document.getElementById('btnActivate').addEventListener('click', async () => {
  if (!currentJobId) return;
  const btn = document.getElementById('btnActivate');
  const st = document.getElementById('activateStatus');
  const name = document.getElementById('detailName').textContent;
  if (!confirm('Jadikan "' + name + '" sebagai world aktif?\n\nPeta ini disalin ke public/world/ dan game akan memakainya setelah reload.')) return;
  btn.disabled = true; st.textContent = 'mengaktifkan…';
  try {
    const r = await fetch(API + '/jobs/' + currentJobId + '/activate', { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    st.textContent = 'aktif: ' + j.worldVersion + ' · ' + j.worldChunks + '×' + j.worldChunks + ' chunks';
    st.style.color = 'var(--accent)';
  } catch (e) {
    st.textContent = 'gagal: ' + e.message;
    st.style.color = 'var(--err)';
    btn.disabled = false;
  }
});

// prefetch defaults
document.getElementById('bbox').value = '106.7916,-6.2538,106.8097,-6.2358';

loadJobs();
</script>
</body>
</html>
